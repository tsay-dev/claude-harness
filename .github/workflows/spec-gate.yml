#   spec-gate — 実装着手ゲートの CI 裏取り（再利用可能ワークフロー / workflow_call）
#
#   commit-msg フック（L1）は --no-verify で回避できるため、回避不能な L2 として
#   同じ spec-lint を CI で走らせる。ロジックは harness 側に集約し、各プロジェクトは
#   薄い呼び出しスタブから uses: で参照する（本 harness は PUBLIC なので別オーナーの
#   private リポジトリからも呼べる）:
#
#     # <project>/.github/workflows/spec-gate.yml
#     name: spec-gate
#     on: { pull_request: , push: { branches: [main] } }
#     jobs:
#       spec-gate:
#         uses: GoboMan/claude-harness/.github/workflows/spec-gate.yml@vX.Y.Z
#
#   検査ツールは呼び出し側（プロジェクト）の .claude（= 本 harness の submodule）に
#   同梱の spec-lint を使う。バージョンは submodule の pin で決まる。
name: spec-gate

on:
  workflow_call:

jobs:
  spec-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      #   docs SSOT のフォーマット / ライフサイクル（契約カバレッジ warn 含む）
      - name: Validate docs SSOT
        run: node .claude/tools/spec-lint/spec-lint.mjs validate

      #   トレーサビリティ（被覆・@covers/@implements・配置・baseline ラチェット）。traceconfig.json を持つホストのみ
      - name: Trace check (new violations fail)
        shell: bash
        run: |
          if [ -f traceconfig.json ]; then node .claude/tools/trace-check/trace-check.mjs; else echo "traceconfig.json なし: trace-check をスキップ"; fi

      #   PR の各コミットの UC: トレーラを検査（UC / REQ が active でない・契約が無い/未 fixed なら落とす）
      #   push 単発では base が不定なため PR のみ（validate は常時走る）
      - name: Gate commits (UC トレーラの UC active・契約 fixed を要求)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          for sha in $(git rev-list "$base".."$head"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg.txt"
            node .claude/tools/spec-lint/spec-lint.mjs gate --message "$RUNNER_TEMP/msg.txt"
          done
