# Boundary contract — one UC (one vertical slice), one file
# With UC.md and the REQ-*.md beside it this forms the slice's MIS (holds only the shape of the boundary; behavior and rules live in UC.md / REQ / BR)
# This is NOT OpenAPI. One format covers HTTP and non-HTTP boundaries alike (why: docs/adr/0001)
# Conformance is judged by `node .claude/tools/spec-lint/spec-lint.mjs validate` — never make your own reading the grounds for a pass
# Accepted YAML is a strict subset (why: docs/adr/0002):
#   - anchors and aliases (& / *) are an error — share through _shared/components.yaml instead
#   - block scalars (| / >) are an error — long prose belongs in UC.md or a REQ
# Placeholders (UC-000 / YYYY-MM-DD / <...>) must be replaced with real values before it is marked fixed
# Write summary and when text in Japanese
#
# Which transport — decide by what the call actually crosses, never by who calls whom inside the app:
#   http         a request leaves the process over HTTP (our own server or someone else's)
#   sdk          a third party's SDK surface (Firebase, Supabase, a payment SDK …) — usually owned: false + source:
#   local-store  persistence on the device / the host (UserDefaults, Keychain, files, SQLite, IndexedDB …)
#   device       an OS capability behind a permission or hardware (camera, HealthKit, calendar, location …) — declare requires:
#   deeplink     the app is opened by a URL (always inbound)     push  the app receives a notification payload (always inbound)
#   A boundary between two modules of the same app (UI ↔ logic, feature ↔ feature, a repository protocol) is NOT an
#   operation: the language's type system is its contract (R-1204). A UC whose only boundaries are internal declares
#   operations: {} + x-no-boundary. Never model an internal call as http or sdk to have "something" in the contract
x-uc: UC-000                 # must match the ID part of the directory name UC-000-<slug> (trace-check C9)
x-status: draft              # draft | fixed (the caller marks it fixed; never do it yourself)
x-spec: ./UC.md              # the behavioral SSOT (UC.md + the REQ-*.md in this directory)
x-updated: YYYY-MM-DD

operations:
  # Key = the operation name (lowerCamelCase, unique within this file). It is the call site's identity
  <operationName>:
    transport: http          # http | sdk | local-store | deeplink | push | device (enforced by spec-lint, which is authoritative)
    direction: outbound      # outbound = this app calls out / inbound = this app is called
    owned: true              # true = we decide this shape / false = we transcribe someone else's (add source:)
    auth: <scheme>           # a name defined in _shared authSchemes, or none. Never omit — "forgot" and "not needed" must stay distinguishable
    summary: <何をするか 1 行>  # one line only; no detailed explanation
    wire:                    # required when transport is http, an error otherwise
      method: POST
      path: /xxx
      success: 200
    request:
      type: object
      required: [i_xxx]
      properties:
        i_xxx:
          type: string
          minLength: 1
          maxLength: 255
          # description is a short note on the wire constraint only (business meaning and rules live in the spec)
    response:
      type: object
      required: [id, status]
      properties:
        id: { type: integer }
        status: { type: string, const: ok }
    errors:                  # one entry per triggering condition. code must be defined in _shared errorCodes.
                             # errors: [] declares "this operation has no failure path" (reading a stored setting, say):
                             # no failure example is required then. Omitting the key is NOT that declaration — omitted and
                             # empty are kept distinct, the same way auth: none is distinct from a missing auth
      - code: INVALID_INPUT
        when: <発生条件を 1 行>   # a word or a single line; never restate the business rule
        wire: { status: 400 }  # only when transport is http
      - code: FORBIDDEN
        when: <発生条件を 1 行>
        wire: { status: 403 }
    examples:                # mandatory once fixed: at least one success and (unless errors: []) one failure, with real values.
                             # A failure example may carry keys the request forbids (additionalProperties: false / not:) —
                             # the counter-example is the point, so spec-lint matches only success examples against request.properties
      ok:
        request: { i_xxx: "abc" }
        response: { id: 1, status: ok }
      invalid:
        request: { i_xxx: "" }
        error: INVALID_INPUT

# --- Shapes shared by 2+ operations of THIS UC (optional top-level key) ---
#
#  Reference them as $ref: "#/schemas/<Name>". A shape used by 2+ UCs goes to ../../../_shared/components.yaml instead
#  (the orchestrator adds it; you report the request). A shape used by a single operation stays inline in that operation
#
#   schemas:
#     VoiceComposeState:
#       type: object
#       required: [phase]
#       properties:
#         phase: { type: string, enum: [idle, recording, done] }

# --- Variants by transport (uncomment the ones this UC needs) ---
#
#  Local persistence — the shape is ours to decide, so owned stays true. No wire
#   saveAppearance:
#     transport: local-store
#     direction: outbound
#     owned: true
#     auth: none
#     summary: <表示テーマを保存する>
#     request:
#       type: object
#       required: [theme]
#       properties:
#         theme: { type: string, enum: [light, dark, system] }
#     response: { type: object, properties: { theme: { type: string } } }
#     errors:
#       - { code: INVALID_INPUT, when: <未知の theme> }
#     examples:
#       ok: { request: { theme: dark }, response: { theme: dark } }
#       invalid: { request: { theme: neon }, error: INVALID_INPUT }
#
#  Deeplink / universal link — the app is called, so direction is inbound. entry: is the pattern
#   openItem:
#     transport: deeplink
#     direction: inbound
#     owned: true
#     auth: none
#     summary: <リンクから商品詳細を開く>
#     entry: myapp://item/{itemId}
#     request:
#       type: object
#       required: [itemId]
#       properties:
#         itemId: { type: string, minLength: 1 }
#
#  Push notification — inbound as well. entry: is the payload's discriminator
#   receiveOrderUpdate:
#     transport: push
#     direction: inbound
#     owned: true
#     auth: none
#     summary: <注文状態の更新通知を受け取る>
#     entry: order.updated
#     request:
#       type: object
#       required: [orderId, status]
#       properties:
#         orderId: { type: string }
#         status: { type: string, enum: [shipped, delivered] }
#
#  Device capability — requires: declares the permission this operation depends on.
#  A requires: with no matching permission error is an error (the denied path must be in the contract)
#   capturePhoto:
#     transport: device
#     direction: outbound
#     owned: true
#     auth: none
#     summary: <カメラで写真を撮る>
#     requires: [camera]
#     response: { type: object, required: [uri], properties: { uri: { type: string } } }
#     errors:
#       - { code: PERMISSION_DENIED, when: <カメラ権限が拒否されている> }
#
#  A third party's boundary (Firebase / Supabase / an existing external API).
#  owned: false means we transcribe rather than settle — the DB correspondence check is waived and source: is required
#   fetchProfile:
#     transport: sdk
#     direction: outbound
#     owned: false
#     source: <写し取り元の URL または SDK のバージョン>
#     auth: bearer
#     summary: <プロフィールを取得する>
#     response: { type: object, required: [id, name], properties: { id: { type: string }, name: { type: string } } }
#     errors:
#       - { code: NOT_FOUND, when: <該当ユーザーなし> }

# --- A UC with no boundary at all ---
#
#  A UC that closes inside one screen (no network, no persistence, no OS capability)
#  declares zero boundaries rather than going without a contract. This is a declaration, not an exemption,
#  so develop skill §2's start gate stays intact. The reason is required — operations: {} alone is an error
#
#   operations: {}
#   x-no-boundary: <入力中のバリデーション表示のみで、通信も永続もない>
